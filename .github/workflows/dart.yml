name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create env file
        run: |
          printf 'NASA_API_KEY=%s\n' "${NASA_API_KEY:-DEMO_KEY}" > .env
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - run: flutter pub get

      # Generates the iOS config without invoking Flutter's signing check
      - run: flutter build ios --config-only --release --no-codesign

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild.log

      # Only runs when the archive step fails: prints the lines that matter
      - name: Show errors
        if: failure()
        run: grep -n -i -B3 -A8 "error" xcodebuild.log | head -120

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Runner.xcarchive/Products/Applications/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qq -r -9 CentralianSkywatch.ipa Payload

      # Private copy: download from the run's Artifacts section
      - uses: actions/upload-artifact@v4
        with:
          name: CentralianSkywatch-ipa
          path: build/ipa/CentralianSkywatch.ipa
          retention-days: 7

      # Public pre-release (repo is public, so anyone can download this)
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ipa/CentralianSkywatch.ipa
          asset_name: CentralianSkywatch.ipa
          tag: alpha
          release_name: Alpha Test Build
          prerelease: true
          overwrite: true
          body: "Unsigned test build. Sign with Sideloadly or AltStore before installing."
